name: 'Toolkit kit'

# Builds the Symfony UX Toolkit kit with kit/build.php and lints it. A release tag (vX.Y.Z) also publishes it to the
# read-only repository silarhi/tabler-ux-kit, tagged X.Y.Z: Toolkit releases before 3.6 cannot install from a tag
# prefixed with "v" (https://github.com/symfony/ux/pull/4074).

on:
    pull_request:
        paths:
            - 'templates/**'
            - 'docs/examples/**'
            - 'docs/src/content/docs/components/**'
            - 'kit/**'
            - 'LICENSE'
            - '.github/workflows/kit.yml'
    push:
        branches: ['main']
        tags: ['v*']

permissions:
    contents: read

jobs:
    build:
        name: Build and lint
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v7

            - uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.5'
                  coverage: none

            - name: Build the kit
              run: php kit/build.php

            # Installed apart from the bundle: the Toolkit requires PHP 8.4 and Symfony 7.4, above the bundle's floors
            - name: Install the Symfony UX Toolkit
              run: |
                  mkdir "$RUNNER_TEMP/toolkit"
                  composer require --working-dir="$RUNNER_TEMP/toolkit" --no-interaction --no-progress symfony/ux-toolkit symfony/http-client

            - name: Lint the kit
              run: php "$RUNNER_TEMP/toolkit/vendor/bin/ux-toolkit-kit-lint" var/kit --fail-on-warning

    publish:
        name: Publish
        needs: [build]
        if: startsWith(github.ref, 'refs/tags/v')
        runs-on: ubuntu-latest
        timeout-minutes: 10
        concurrency:
            group: kit-publish
        steps:
            - uses: actions/checkout@v7

            - uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.5'
                  coverage: none

            - name: Check out silarhi/tabler-ux-kit
              uses: actions/checkout@v7
              with:
                  repository: silarhi/tabler-ux-kit
                  ssh-key: ${{ secrets.KIT_DEPLOY_KEY }}
                  path: var/tabler-ux-kit

            - name: Build the kit into the checkout
              run: php kit/build.php var/tabler-ux-kit

            - name: Commit, tag and push
              working-directory: var/tabler-ux-kit
              env:
                  VERSION: ${{ github.ref_name }}
              run: |
                  git config user.name 'github-actions[bot]'
                  git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
                  git add --all
                  git commit --allow-empty --message "Release ${VERSION#v}" \
                      --message "Built from https://github.com/${GITHUB_REPOSITORY}/tree/${VERSION}"
                  git tag "${VERSION#v}"
                  git push origin HEAD:main "${VERSION#v}"
