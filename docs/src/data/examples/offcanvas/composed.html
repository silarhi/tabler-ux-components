<button type="button" class="btn"  data-bs-toggle="offcanvas" data-bs-target="#user-filters"><i class="ti ti-filter icon" ></i>
 Filters
</button>
<div class="offcanvas offcanvas-end" tabindex="-1" id="user-filters" >
    <div  class="offcanvas-header"><h5  class="offcanvas-title">Filter users</h5>
        <button type="button"  class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
    </div>
    <div  class="offcanvas-body"><label class="form-check">
            <input type="checkbox" class="form-check-input" checked>
            <span class="form-check-label">Active</span>
        </label>
        <label class="form-check">
            <input type="checkbox" class="form-check-input">
            <span class="form-check-label">Invited</span>
        </label>
        <label class="form-check">
            <input type="checkbox" class="form-check-input">
            <span class="form-check-label">Suspended</span>
        </label>
    </div>
    <div  class="offcanvas-footer"><button type="button" class="btn w-100 btn-primary"  data-bs-dismiss="offcanvas">Apply filters</button>
    </div>
</div>
