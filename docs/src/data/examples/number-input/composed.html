<div class="number-input" data-bs-toggle="number-input" >
    <button type="button" class="btn btn-icon" data-bs-number-input-action="decrement" aria-label="Fewer" ><i class="ti ti-chevron-down" ></i>
    </button>
    <input type="text" class="form-control" name="amount" value="1000" min="0" step="100" aria-label="Amount"  style="--tblr-number-input-input-width: 6rem">
    <button type="button" class="btn btn-icon" data-bs-number-input-action="increment" aria-label="More" ><i class="ti ti-chevron-up" ></i>
    </button>
</div>
