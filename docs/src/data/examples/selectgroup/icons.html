<div class="d-flex flex-column gap-3">
    <div class="form-selectgroup"  role="group" aria-label="Weather">
            <label class="form-selectgroup-item" >
    <input type="checkbox" name="weather[]" value="sun" class="form-selectgroup-input" checked aria-label="Sunny" >
    <span class="form-selectgroup-label" >    <i class="ti ti-sun" ></i>
</span>
</label>
<label class="form-selectgroup-item" >
    <input type="checkbox" name="weather[]" value="moon" class="form-selectgroup-input" aria-label="Clear night" >
    <span class="form-selectgroup-label" >    <i class="ti ti-moon" ></i>
</span>
</label>
<label class="form-selectgroup-item" >
    <input type="checkbox" name="weather[]" value="rain" class="form-selectgroup-input" aria-label="Rain" >
    <span class="form-selectgroup-label" >    <i class="ti ti-cloud-rain" ></i>
</span>
</label>
<label class="form-selectgroup-item" >
    <input type="checkbox" name="weather[]" value="other" class="form-selectgroup-input" >
    <span class="form-selectgroup-label" >    Other</span>
</label>
    </div>
    <div class="form-selectgroup"  role="group" aria-label="View">
            <label class="form-selectgroup-item" >
    <input type="radio" name="view" value="home" class="form-selectgroup-input" checked >
    <span class="form-selectgroup-label" >    <i class="ti ti-home me-1" ></i>
Home</span>
</label>
<label class="form-selectgroup-item" >
    <input type="radio" name="view" value="user" class="form-selectgroup-input" >
    <span class="form-selectgroup-label" >    <i class="ti ti-user me-1" ></i>
User</span>
</label>
<label class="form-selectgroup-item" >
    <input type="radio" name="view" value="settings" class="form-selectgroup-input" >
    <span class="form-selectgroup-label" >    <i class="ti ti-settings me-1" ></i>
Settings</span>
</label>
    </div>
</div>
