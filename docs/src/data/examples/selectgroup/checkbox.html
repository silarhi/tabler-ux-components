<div class="form-selectgroup"  role="group" aria-label="Status">
            <label class="form-selectgroup-item" >
    <input type="checkbox" name="status[]" value="open" class="form-selectgroup-input" checked >
    <span class="form-selectgroup-label" >    Open</span>
</label>
<label class="form-selectgroup-item" >
    <input type="checkbox" name="status[]" value="review" class="form-selectgroup-input" checked >
    <span class="form-selectgroup-label" >    In review</span>
</label>
<label class="form-selectgroup-item" >
    <input type="checkbox" name="status[]" value="closed" class="form-selectgroup-input" >
    <span class="form-selectgroup-label" >    Closed</span>
</label>
<label class="form-selectgroup-item" >
    <input type="checkbox" name="status[]" value="archived" class="form-selectgroup-input" disabled >
    <span class="form-selectgroup-label" >    Archived</span>
</label>
    </div>
